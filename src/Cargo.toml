[package]
name = "document-searcher"
version = "0.1.0"
edition = "2021"

[dependencies]
# UI Framework
relm4 = { version = "0.7", features = ["libadwaita", "gtk4-0-8"] }
libadwaita = { version = "0.5", features = ["v1_4"] }
gtk = { version = "0.7", features = ["v4_10"] }
gio = { version = "0.7" }

# Concurrency & Channels
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tokio-util = "0.7" # For CancellationToken
async-channel = "2.3"

# Text & File Parsing
docx-rs = "0.5"
lopdf = "0.34"
pdf-extract = "0.7"
leptess = "0.4"
walkdir = "2.4"
mime_guess = "2.0"
unicode-segmentation = "1.10"

# Utils
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"