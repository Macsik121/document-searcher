[package]
name = "document-searcher"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
default = []
ocr = ["dep:leptess"]
windows-ocr = []
desktop = [
    "ocr",
    "dep:libadwaita",
    "dep:gtk",
    "dep:gio",
    "dep:relm4",
    "dep:ashpd",
    "dep:url",
]
windows-desktop = ["windows-ocr"]

[dependencies]
# UI and desktop integration are optional so the search core can be tested on Windows.
libadwaita = { version = "0.6", features = ["v1_4"], optional = true }
gtk = { package = "gtk4", version = "0.8", features = ["v4_10"], optional = true }
gio = { version = "0.19", optional = true }
relm4 = { version = "0.8", features = ["libadwaita"], optional = true }
ashpd = { version = "0.8", features = ["gtk4"], optional = true }
url = { version = "2", optional = true }
leptess = { version = "0.14", optional = true }

# Background processing
async-channel = "2.3"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tokio-util = "0.7"

# Document processing
# Document processing
anyhow = "1.0"
lopdf = "0.31"
pdf-extract = "0.7"
quick-xml = "0.31"
walkdir = "2.4"
zip = "0.6"
# Text decoding: robust fallback for non-UTF-8 legacy text files
# (CP1251/Windows-1251 Cyrillic, UTF-16, Latin-1) common on Russian Windows.
encoding_rs = "0.8"
chardetng = "0.1"

# Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
